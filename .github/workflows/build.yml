name: Build Armbian BSP Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          fetch-depth: 0

      - name: Download BSP toolchain from Release
        if: false
        run: |
          TOOLCHAIN_URL=$(gh release view toolchain-v1 --repo iorca/BSP-Armbian-HZHY --json assets --jq '.assets[0].url')
          echo "Downloading toolchain from: ${TOOLCHAIN_URL}"
          mkdir -p userpatches/toolchain
          curl -L "${TOOLCHAIN_URL}" -o /tmp/toolchain.tar.gz
          tar xzf /tmp/toolchain.tar.gz -C userpatches/toolchain
          ls userpatches/toolchain/HZ-EVM-RK3588-Linux-GCC/bin/ | head -5
          echo "Toolchain ready."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Armbian's fetch_from_repo manages cache/sources/ layout itself;
      # guessing its directory names risks a mismatch. The repo/branch are
      # supplied via userpatches/lib.config (KERNELSOURCE/KERNELBRANCH/
      # BOOTSOURCE/BOOTBRANCH), so Armbian clones the correct vendor trees.

      - name: Copy userpatches and board config
        run: |
          REPO_RAW="https://raw.githubusercontent.com/iorca/BSP-Armbian-HZHY/main"

          # Toolchain / source overrides
          mkdir -p userpatches
          curl -sL "${REPO_RAW}/userpatches/lib.config" -o userpatches/lib.config

          # Board definition — without this Armbian does not know BOARD=hz-evm-rk3588.
          # Armbian looks in config/boards/ (config/sources/boards does not exist).
          mkdir -p config/boards
          curl -sL "${REPO_RAW}/config/boards/hz-evm-rk3588.conf" \
            -o config/boards/hz-evm-rk3588.conf

          # Kernel config. Armbian resolves LINUXCONFIG to
          # config/kernel/<LINUXCONFIG>.config (NOT a defconfig inside the
          # kernel tree). Missing it caused:
          #   sha256sum: config/kernel/HZ-EVM-RK3588_defconfig.config:
          #   No such file or directory   -> hash-files.sh:74 error 1
          mkdir -p config/kernel
          curl -sL "${REPO_RAW}/config/kernel/HZ-EVM-RK3588_defconfig.config" \
            -o config/kernel/HZ-EVM-RK3588_defconfig.config

          mkdir -p userpatches/kernel/rk35xx-vendor-6.1/dt
          curl -sL "${REPO_RAW}/userpatches/kernel/rk35xx-vendor-6.1/dt/HZ-EVM-RK3588.dtsi" \
            -o userpatches/kernel/rk35xx-vendor-6.1/dt/HZ-EVM-RK3588.dtsi

          echo "--- lib.config ---"; cat userpatches/lib.config
          echo "--- board config ---"; cat config/boards/hz-evm-rk3588.conf
          echo "--- kernel config lines ---"; wc -l config/kernel/HZ-EVM-RK3588_defconfig.config
          test -s userpatches/lib.config
          test -s config/boards/hz-evm-rk3588.conf
          test -s config/kernel/HZ-EVM-RK3588_defconfig.config
          test -s userpatches/kernel/rk35xx-vendor-6.1/dt/HZ-EVM-RK3588.dtsi
          grep -q 'status = "disabled"' userpatches/kernel/rk35xx-vendor-6.1/dt/HZ-EVM-RK3588.dtsi

      - name: Set up QEMU static binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Patch armbian uboot.sh for vendor U-Boot 2017.09 (GCC>=13 -Werror=enum-int-mismatch)
        run: |
          # vendor U-Boot 2017.09 triggers -Werror=enum-int-mismatch under GCC>=13.
          # armbian's uboot.sh whitelists many -Wno-error=* but missed this one, aborting
          # at common/command.c:504 (cmd_process enum/int mismatch). Add it to the waiver list.
          sed -i 's#"-Wno-error=incompatible-pointer-types"#"-Wno-error=incompatible-pointer-types"\n\t\t"-Wno-error=enum-int-mismatch"#' lib/functions/compilation/uboot.sh
          grep -n 'enum-int-mismatch' lib/functions/compilation/uboot.sh || true

      - name: Patch armbian rootfs for qemu-user SIGSEGV (QEMU_RESERVED_VA)
        run: |
          # qemu-user 10.x (Debian trixie, used inside the armbian build container)
          # segfaults (uncaught target signal 11) while emulating arm64 during
          # mmdebstrap on GitHub runners (Debian #1053101): the guest binary's mmap
          # overlaps qemu's own address space and clobbers it. This is host-kernel
          # mmap-layout dependent. Force a dedicated 40-bit guest VA range so the
          # guest can never collide with qemu. Exported in the armbian process so it
          # propagates into the mmdebstrap -> apt -> qemu process tree.
          sed -i 's#^function create_new_rootfs_cache_via_debootstrap() {#&\n\texport QEMU_RESERVED_VA=0x1000000000#' lib/functions/rootfs/rootfs-create.sh
          grep -n 'QEMU_RESERVED_VA' lib/functions/rootfs/rootfs-create.sh || true

      - name: Patch armbian bsp-cli sysctl file to avoid dpkg conflict with systemd
        run: |
          # armbian's bsp-cli package (packages/bsp/common/usr/lib/sysctl.d/50-default.conf)
          # collides with systemd 249.11-0ubuntu3.22 on jammy, which now also ships that
          # exact path. dpkg refuses to overwrite -> "trying to overwrite
          # '/usr/lib/sysctl.d/50-default.conf', which is also in package systemd" ->
          # bsp-cli install fails -> build fails (run #50). Rename armbian's copy to a
          # non-colliding name; it still loads after systemd's 50-*, preserving the tweaks.
          if [ -f packages/bsp/common/usr/lib/sysctl.d/50-default.conf ]; then
            mv -f packages/bsp/common/usr/lib/sysctl.d/50-default.conf \
                  packages/bsp/common/usr/lib/sysctl.d/60-armbian-default.conf
            echo "renamed 50-default.conf -> 60-armbian-default.conf"
          else
            echo "packages/bsp/common/usr/lib/sysctl.d/50-default.conf not found; skipping"
          fi
          ls -la packages/bsp/common/usr/lib/sysctl.d/ 2>/dev/null || true

      - name: Patch boot-rk35xx.cmd serial console for vendor kernel (ttyFIQ0 + earlycon)
        run: |
          # Vendor 6.1 BSP: uart2 is owned by fiq-debugger (rk3588-linux.dtsi,
          # rockchip,serial-id=<2>, 1500000) -> console is ttyFIQ0, ttyS2 does not exist.
          # armbian's boot-rk35xx.cmd hardcodes console=ttyS2,1500000 and overrides the
          # DTS chosen bootargs, so the serial port is silent from "Starting kernel" until
          # getty. Also enable earlycon on uart2 (0xfeb50000) by default for bring-up.
          f=config/bootscripts/boot-rk35xx.cmd
          sed -i 's|console=ttyS2,1500000|console=ttyFIQ0,1500000|' "$f"
          sed -i 's|^setenv earlycon "off"|setenv earlycon "on"|' "$f"
          sed -i 's|setenv consoleargs "earlycon ${consoleargs}"|setenv consoleargs "earlycon=uart8250,mmio32,0xfeb50000 ${consoleargs}"|' "$f"
          grep -n 'earlycon\|console=' "$f"
          grep -q 'console=ttyFIQ0,1500000' "$f" && grep -q 'earlycon=uart8250,mmio32,0xfeb50000' "$f" && grep -q '^setenv earlycon "on"' "$f"

      - name: Build Armbian image
        run: |
          # New Armbian CLI uses subcommands. KERNEL_ONLY=yes is REMOVED:
          #   error! KERNEL_ONLY is set. This is not supported anymore.
          #   use ./compile.sh kernel BOARD=hz-evm-rk3588 BRANCH=vendor
          # `kernel` builds only the kernel (+dtbs) and skips rootfs/image,
          # which avoids the binfmt stage (NEEDS_BINFMT is only set for image
          # build / rootfs artifact build). Verifies vendor source fetch and
          # toolchain wiring. Full image build is enabled; the qemu-user SIGSEGV
          # during mmdebstrap is worked around via QEMU_RESERVED_VA + ubuntu-24.04.
          #
          # pipefail: without it the exit code comes from `tee` (always 0),
          # which masks compile.sh failures and shows a false green build.
          set -o pipefail
          unset PREFER_DOCKER
          ./compile.sh \
            build \
            BOARD=hz-evm-rk3588 \
            BRANCH=vendor \
            RELEASE=jammy \
            KERNEL_CONFIGURE=no \
            EXPERT=yes \
            SKIP_EXTERNAL_TOOLCHAINS=yes \
            USE_CCACHE=no \
            2>&1 | tee build.log
        env:
          ARMBIAN_BUILD_FORCE_ARTIFACTS_UPLOAD: "yes"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # KERNEL_ONLY=yes produces debs in output/debs/; a full image build
          # produces output/images/*.img*. Accept either.
          name: armbian-hz-evm-rk3588-output
          path: |
            output/debs/*.deb
            output/images/*.img*
          if-no-files-found: warn
          retention-days: 7

      # CI logs are not readable without a token; annotations are. Emit the
      # interesting log lines as ::error:: so they surface in the run's
      # Annotations section and can be inspected without downloading logs.
      - name: Expose build log via annotations
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "=== hash/sha256 related lines ==="
            grep -inE 'hash|sha256sum|files_to_hash' build.log | head -25 |
              while IFS= read -r l; do echo "::error::HASHLOG $l"; done
            echo "=== patch failure lines ==="
            grep -inE 'patch|hunk|reject|failed|error|traceback|yaml|python' build.log | tail -80 |
              while IFS= read -r l; do echo "::error::PATCHLOG $l"; done
            echo "=== last 120 lines ==="
            tail -120 build.log | while IFS= read -r l; do echo "::error::TAIL $l"; done
          else
            echo "::error::build.log not found"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
