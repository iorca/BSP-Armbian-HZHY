name: Build Armbian BSP Image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Armbian build framework
        uses: actions/checkout@v4
        with:
          repository: armbian/build
          ref: main
          fetch-depth: 0

      - name: Download BSP toolchain from Release
        run: |
          TOOLCHAIN_URL=$(gh release view toolchain-v1 --repo iorca/BSP-Armbian-HZHY --json assets --jq '.assets[0].url')
          echo "Downloading toolchain from: ${TOOLCHAIN_URL}"
          mkdir -p /opt/toolchain
          curl -L "${TOOLCHAIN_URL}" -o /tmp/toolchain.tar.gz
          tar xzf /tmp/toolchain.tar.gz -C /opt/toolchain
          ls /opt/toolchain/HZ-EVM-RK3588-Linux-GCC/bin/ | head -5
          echo "Toolchain ready."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: we deliberately do NOT pre-clone kernel/u-boot/rkbin here.
      # Armbian's fetch_from_repo manages cache/sources/ layout itself;
      # guessing its directory names risks a mismatch. The repo/branch are
      # supplied via userpatches/lib.config (KERNELSOURCE/KERNELBRANCH/
      # BOOTSOURCE/BOOTBRANCH), so Armbian clones the correct vendor trees.

      - name: Copy userpatches and board config
        run: |
          REPO_RAW="https://raw.githubusercontent.com/iorca/BSP-Armbian-HZHY/main"

          # Toolchain / source overrides
          mkdir -p userpatches
          curl -sL "${REPO_RAW}/userpatches/lib.config" -o userpatches/lib.config

          # Board definition — without this Armbian does not know BOARD=hz-evm-rk3588.
          # Armbian looks in config/boards/ (config/sources/boards does not exist).
          mkdir -p config/boards
          curl -sL "${REPO_RAW}/config/boards/hz-evm-rk3588.conf" \
            -o config/boards/hz-evm-rk3588.conf

          echo "--- lib.config ---"; cat userpatches/lib.config
          echo "--- board config ---"; cat config/boards/hz-evm-rk3588.conf

      - name: Set up QEMU static binfmt
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Armbian image
        run: |
          # KERNEL_ONLY=yes: build kernel/u-boot only, no rootfs/image.
          # This skips the binfmt requirement (Armbian sets NEEDS_BINFMT=yes
          # only for image build / rootfs artifact build — see
          # lib/functions/rootfs/qemu-static.sh::prepare_host_binfmt_qemu),
          # which currently fails inside the unprivileged GH container.
          # Verifies vendor source fetch + toolchain first; flip back to
          # "no" once the binfmt/rootfs issue is solved.
          #
          # pipefail: without it the exit code comes from `tee` (always 0),
          # which masks compile.sh failures and shows a false green build.
          set -o pipefail
          ./compile.sh \
            BOARD=hz-evm-rk3588 \
            BRANCH=vendor \
            RELEASE=jammy \
            KERNEL_CONFIGURE=no \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_ONLY=yes \
            COMPRESS_OUTPUTIMAGE=sha,gpg \
            EXPERT=yes \
            SKIP_EXTERNAL_TOOLCHAINS=yes \
            USE_CCACHE=no \
            2>&1 | tee build.log
        env:
          ARMBIAN_BUILD_FORCE_ARTIFACTS_UPLOAD: "yes"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # KERNEL_ONLY=yes produces debs in output/debs/; a full image build
          # produces output/images/*.img*. Accept either.
          name: armbian-hz-evm-rk3588-output
          path: |
            output/debs/*.deb
            output/images/*.img*
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
