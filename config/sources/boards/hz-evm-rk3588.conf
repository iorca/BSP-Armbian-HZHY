# Board configuration for HZ-EVM-RK3588
# Vendor BSP kernel + U-Boot, stage 1 (no MIPI/DSI)

BOARD_NAME="HZ-EVM-RK3588"
BOARDFAMILY="rk35xx"
BOOTCONFIG="rk3588_defconfig"
KERNEL_TARGET="Image"
MODULES="rockchip-cpufreq dwc3 xhci-hcd r8169 stmmac rk_gmac-dwmac"
MODULES_BLACKLIST=""

# DTS from vendor SDK — keep original, no MIPI modifications in stage 1
LINUXCONFIG="HZ-EVM-RK3588_defconfig"
BOOT_FDT_FILE="rockchip/HZ-EVM-RK3588.dtb"

# Serial console
SERIALCON="ttyFIQ0:1500000"

# Boot script
BOOTSCRIPT="boot-rk35xx.cmd:boot.cmd"

# U-Boot binary layout for Rockchip vendor
UBOOT_TARGET_MAP="u-boot.itb;;u-boot.itb idbloader.img;;idbloader.img"

# No desktop, minimal server image for stage 1
BUILD_DESKTOP="no"
BUILD_MINIMAL="yes"

# Release target
RELEASE="jammy"
